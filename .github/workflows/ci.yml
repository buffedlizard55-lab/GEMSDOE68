name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: pytest -q tests   # data-dependent tests skip when .cache is absent
      - run: python -c "import json;c=json.load(open('evidence/run_card.json'));assert c['files']['primary']['validator']['all_checks_passed'];print(c['verdict'])"
