name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: pytest -q tests   # data-dependent tests skip when .cache is absent
      - name: canonical run card + raster hash
        run: |
          python - <<'PYEOF'
          import hashlib, json
          c = json.load(open('evidence/run_card_exp4.json'))
          assert c['verdict'] in ('promote', 'promote-with-caveats', 'negative'), c['verdict']
          r = c['raster']['primary']
          h = hashlib.sha256(open('docs/downloads/' + r['name'], 'rb').read()).hexdigest()
          assert h == r['sha256'], (h, r['sha256'])
          print('canonical card OK:', c['verdict'], c['submission_name'])
          PYEOF
