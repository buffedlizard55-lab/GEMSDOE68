name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=src pytest -q tests  # data-dependent tests skip without restored inputs
      - run: python scripts/build_site_verified.py
      - run: python scripts/check_site_release.py
      - run: git diff --exit-code -- docs  # generated Pages must match the checked-in run card
