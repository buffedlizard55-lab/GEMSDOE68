[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gemsdoe68"
version = "0.1.0"
description = "Auto-context stacked fault discovery for the DOE GEMS Prize (DrivenData #306)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "rasterio>=1.3",
    "scikit-image>=0.21",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "pandas>=2.0",
    "shapely>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
